name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch: # Allows manual trigger from the GitHub UI

concurrency:
  group: deploy-master
  cancel-in-progress: false

jobs:
  deploy-render:
    name: Trigger Render deploy (backend)
    runs-on: ubuntu-latest
    steps:
      - name: Call Render deploy hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::warning::RENDER_DEPLOY_HOOK_URL secret not set — skipping."
            exit 0
          fi
          echo "Triggering Render deploy..."
          curl --silent --show-error --fail --request POST "$RENDER_DEPLOY_HOOK_URL"
          echo ""
          echo "✅ Render deploy triggered."

  deploy-vercel:
    name: Trigger Vercel deploy (frontend)
    runs-on: ubuntu-latest
    steps:
      - name: Call Vercel deploy hook
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK_URL" ]; then
            echo "::warning::VERCEL_DEPLOY_HOOK_URL secret not set — skipping."
            exit 0
          fi
          echo "Triggering Vercel deploy..."
          curl --silent --show-error --fail --request POST "$VERCEL_DEPLOY_HOOK_URL"
          echo ""
          echo "✅ Vercel deploy triggered."
